<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cini Tarot — Draw your watch</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-tab-btn { flex: 1; max-width: 140px; font-size: 14px !important; padding: 10px 18px !important; }
</style>
</head>
<body>

<div class="film-strip top"></div>
<div class="film-strip bottom"></div>
<div class="magic-bg" id="magicBg"></div>

<div class="stage container">

  <!-- SCREEN 1: Sign up / Log in -->
<section class="screen active" id="screen-signup">
  <div class="flex-fill d-flex flex-column justify-content-center">
    <h1 class="wordmark text-center mb-4">Cini Tarot</h1>
    <div class="avatar-picker mx-auto mb-3" id="avatarPicker">
      <i class="bi bi-camera-fill"></i>
    </div>

    <div class="d-flex justify-content-center gap-2 mb-3">
      <button class="btn btn-candy candy-blue auth-tab-btn" id="tabSignup" data-mode="signup">Sign Up</button>
      <button class="btn btn-candy-ghost auth-tab-btn" id="tabLogin" data-mode="login">Log In</button>
    </div>

    <input class="form-control candy-field mb-3" type="text" id="signupName" placeholder="Your name">
    <input class="form-control candy-field mb-3" type="email" id="signupContact" placeholder="Email">
    <input class="form-control candy-field mb-2" type="password" id="signupPassword" placeholder="Password (6+ characters)">
    <p class="text-center mb-3" id="signupError" style="color:#FF7AA8; font-size:13px; min-height:16px;"></p>

    <button class="btn btn-candy candy-blue w-100" id="authSubmitBtn">Create account</button>
  </div>
</section>

  <!-- SCREEN 2: Home -->
  <section class="screen" id="screen-home">
    <p class="greeting text-center" id="greetingText">Welcome</p>
    <div class="home-center flex-fill d-flex flex-column align-items-center justify-content-center">
      <div class="character" id="characterHome">
        <div class="char-glow"></div>
        <div class="hat"></div><div class="brim"></div><div class="head"></div>
      </div>
      <div class="speech-bubble">Want to know your movie tarot?</div>
      <button class="btn btn-candy candy-gold" id="startQuizBtn">Start</button>
    </div>
  </section>

  <!-- SCREEN 3: Question (reused for all 4 questions) -->
  <section class="screen" id="screen-question">
    <div class="progress-dots" id="progressDots"></div>
    <div class="character character-sm" id="characterQuestion">
      <div class="hat"></div><div class="brim"></div><div class="head"></div>
    </div>
    <p class="question-text text-center" id="questionText"></p>
    <p class="question-hint text-center" id="questionHint"></p>
    <div class="options-grid" id="optionsList"></div>
    <div class="question-nav d-flex justify-content-between">
      <button class="btn btn-candy-ghost" id="backBtn">Back</button>
      <button class="btn btn-candy candy-pink" id="nextBtn" disabled>Next</button>
    </div>
  </section>

  <!-- SCREEN 4: Reveal -->
  <section class="screen" id="screen-reveal">
    <div class="character" id="characterReveal">
      <div class="char-glow"></div>
      <div class="hat"></div><div class="brim"></div><div class="head"></div>
    </div>
    <p class="reveal-lead text-center">Two cards chose you tonight</p>
    <div class="cards-row" id="cardsRow"></div>
    <p class="reveal-desc text-center" id="revealDesc">Tap a card to reveal its title</p>
    <button class="btn btn-candy-ghost mx-auto mt-3" id="reshuffleBtn">Ask again</button>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/app.js"></script>
</body>
</html>
